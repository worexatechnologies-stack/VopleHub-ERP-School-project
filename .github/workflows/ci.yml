name: VolpeHub CI

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check / lint
        run: npm run lint

      - name: Build frontend bundle
        run: npm run build

  backend-check:
    name: Backend Tests & Django Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volpehub_test
          POSTGRES_USER: volpehub_test
          POSTGRES_PASSWORD: volpehub_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volpehub_test -d volpehub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django deployment and model check
        env:
          DATABASE_URL: postgres://volpehub_test:volpehub_test_password@localhost:5432/volpehub_test
          DJANGO_SECRET_KEY: ci-validation-secret-key-at-least-32-chars-long
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run

      - name: Run automated unit tests
        env:
          DATABASE_URL: postgres://volpehub_test:volpehub_test_password@localhost:5432/volpehub_test
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          python backend/manage.py test apps.community apps.notifications apps.timetable apps.staff apps.exams apps.store

  docker-dry-run:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Frontend image (dry run)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: volpehub-web:dryrun

      - name: Build Backend image (dry run)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: volpehub-api:dryrun

      - name: Build Forward proxy image (dry run)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./forward_proxy
          file: ./forward_proxy/Dockerfile
          push: false
          tags: volpehub-forwardproxy:dryrun

      - name: Validate production Compose file
        run: docker compose --env-file backend/.env.example -f docker-compose.prod.yml config -q
