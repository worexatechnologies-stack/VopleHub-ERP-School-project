name: VolpeHub CD (Production)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci-verification:
    name: Run CI Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volpehub_test
          POSTGRES_USER: volpehub_test
          POSTGRES_PASSWORD: volpehub_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volpehub_test -d volpehub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Django system checks
        env:
          DATABASE_URL: postgres://volpehub_test:volpehub_test_password@localhost:5432/volpehub_test
          DJANGO_SECRET_KEY: cd-verify-secret-key-at-least-32-chars-long
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run

      - name: Run unit test suite
        env:
          DATABASE_URL: postgres://volpehub_test:volpehub_test_password@localhost:5432/volpehub_test
          DJANGO_SECRET_KEY: cd-test-secret-key-at-least-32-chars-long
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: |
          python backend/manage.py test \
            apps.accounts.tests.CredentialVaultSyncSafetyTests \
            apps.accounts.tests.TurnstileLoginResponseTests \
            apps.accounts.tests.StudentCredentialRecoveryTests \
            apps.academics.tests.HomeworkNotificationFanoutTests \
            apps.accounts.tests.TemporaryPasswordMiddlewareTests.test_school_admin_password_change_clears_vault_temporary_marker \
            apps.accounts.tests.TemporaryPasswordMiddlewareTests.test_users_without_vault_are_not_reprompted_after_first_login \
            apps.community apps.notifications apps.timetable apps.staff apps.exams apps.store

  publish-images:
    name: Build & Publish GHCR Images
    needs: ci-verification
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      repo_owner: ${{ steps.repo_owner.outputs.lowercase }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lowercase repository owner for GHCR compatibility
        id: repo_owner
        run: |
          echo "lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set Release Tag
        id: meta
        run: |
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Require Cloudflare Turnstile site key
        env:
          TURNSTILE_SITE_KEY: ${{ vars.CLOUDFLARE_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "CLOUDFLARE_TURNSTILE_SITE_KEY is missing from GitHub Actions variables." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.lowercase }}/volpehub-api:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.lowercase }}/volpehub-api:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.lowercase }}/volpehub-web:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.lowercase }}/volpehub-web:latest
          build-args: |
            VITE_CLOUDFLARE_TURNSTILE_SITE_KEY=${{ vars.CLOUDFLARE_TURNSTILE_SITE_KEY }}

      - name: Build and push Forward proxy image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./forward_proxy
          file: ./forward_proxy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.lowercase }}/volpehub-forwardproxy:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.lowercase }}/volpehub-forwardproxy:latest

  deploy-production:
    name: Safe Production Deployment
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment assets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure SSH key and strict host verification
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Transfer Compose and operational scripts to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            Caddyfile \
            backup.sh \
            backup-scheduler.sh \
            restore.sh \
            rollback.sh \
            deploy.sh \
            "${SSH_USER}@${SSH_HOST}:/opt/volpehub/"

          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "mkdir -p /opt/volpehub/docker/postgres /opt/volpehub/backups"

          scp -i ~/.ssh/deploy_key \
            docker/postgres/init-app-role.sh \
            "${SSH_USER}@${SSH_HOST}:/opt/volpehub/docker/postgres/"

          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "chmod +x /opt/volpehub/backup.sh /opt/volpehub/backup-scheduler.sh /opt/volpehub/restore.sh /opt/volpehub/rollback.sh /opt/volpehub/deploy.sh /opt/volpehub/docker/postgres/init-app-role.sh"

      - name: Install Turnstile secret on VPS
        env:
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set +x
          if [ -z "$CLOUDFLARE_TURNSTILE_SECRET_KEY" ]; then
            echo "CLOUDFLARE_TURNSTILE_SECRET_KEY is missing from GitHub Actions secrets." >&2
            exit 1
          fi

          scp -i ~/.ssh/deploy_key \
            .github/scripts/install_turnstile_secret.py \
            "${SSH_USER}@${SSH_HOST}:/tmp/volpehub-install-turnstile-secret.py"

          printf '%s' "$CLOUDFLARE_TURNSTILE_SECRET_KEY" | \
            ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
              'python3 /tmp/volpehub-install-turnstile-secret.py; result=$?; rm -f /tmp/volpehub-install-turnstile-secret.py; exit "$result"'

      - name: Execute atomic production deployment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          IMAGE_TAG: ${{ needs.publish-images.outputs.image_tag }}
          GHCR_NAMESPACE: ${{ needs.publish-images.outputs.repo_owner }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "/opt/volpehub/deploy.sh '${IMAGE_TAG}' '${GHCR_NAMESPACE}' '${GHCR_ACTOR}' '${GHCR_PULL_TOKEN:-}'"
