user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  20480;
    use epoll;
    multi_accept on;
}

http {
    # Docker's embedded DNS supplies all scaled API container addresses.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Caddy is the trusted external TLS edge and proxies to this container over
    # HTTP. Preserve its sanitized scheme header so Django does not redirect
    # HTTPS requests back to HTTPS in a loop.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time upstream=$upstream_addr '
                    'uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /dev/stdout main buffer=64k flush=1s;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;

    keepalive_timeout  65;
    keepalive_requests 10000;
    reset_timedout_connection on;

    include /etc/nginx/conf.d/*.conf;
}
