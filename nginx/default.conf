# ==============================================================================
# NGINX LOAD BALANCER, REVERSE PROXY & SECURITY GATEWAY (HIGH CONCURRENCY)
# System: Volpehub Education Management System
# Features: Upstream Least-Conn Load Balancing, Sticky WebSocket Clustering,
#           Anti-XSS (CSP), Anti-CSRF Origin Guard, NAT-Aware Rate Limiting
# ==============================================================================

# 1. Upstream Backend API Cluster (Least-Connection Load Balancing with Keepalive)
upstream api-backend-cluster {
    least_conn;
    zone api_backend_cluster 64k;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 128;
}

# 2. Upstream Real-Time WebSocket Cluster (IP-Hash Session Stickiness)
upstream websocket-cluster {
    # Channels uses Redis for cross-process fan-out, so WebSocket stickiness is
    # unnecessary and would pin a shared campus IP to one API replica.
    least_conn;
    zone websocket_cluster 64k;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 128;
}

# 3. Trusted Proxy & CDN Configuration (Cloudflare + Docker/Private VPC Subnets)
# Strips untrusted proxy hops and extracts the authentic client IP
set_real_ip_from 127.0.0.1;
# Nginx is only exposed through Caddy on the private Compose network. Trust
# Docker peers so Caddy's sanitized X-Forwarded-For yields the actual client IP.
# Do not publish the web/Nginx port directly to the Internet.
set_real_ip_from 172.16.0.0/12;
# Cloudflare Official IPv4 CIDRs
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# Cloudflare Official IPv6 CIDRs
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Signed-in browser traffic gets its own edge quota per Django session. Anonymous
# requests fall back to the verified client IP because no user identity exists.
map $cookie_sessionid $cookie_or_ip_limit_key {
    ""      $remote_addr;
    default $cookie_sessionid;
}

map $http_authorization $request_limit_key {
    ""      $cookie_or_ip_limit_key;
    default $http_authorization;
}

# These quotas are per session for authenticated clients and per IP only for
# anonymous clients. Django separately enforces its per-user quota.
limit_req_zone $request_limit_key zone=general_api_zone:20m rate=20r/s;
limit_req_zone $request_limit_key zone=ws_handshake_zone:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr_conn_zone:20m;

# 5. Anti-CSRF: State-Changing Method Flag
map $request_method $is_modifying_request {
    default 0;
    POST 1;
    PUT 1;
    PATCH 1;
    DELETE 1;
}

# 6. Anti-CSRF: Untrusted Origin Verification
map $http_origin $untrusted_csrf_origin {
    default 1;
    "~^https?://(localhost|127\.0\.0\.1)(:\d+)?$" 0;
    "~^https?://([a-zA-Z0-9-]+\.)?volpehub\.in(:\d+)?$" 0;
    "~^https?://([a-zA-Z0-9-]+\.)?volpehub\.education(:\d+)?$" 0;
    "~^https?://([a-zA-Z0-9-]+\.)?worexa\.com(:\d+)?$" 0;
    "" 0; # Native mobile apps, cURL, or same-origin requests without an Origin header
}

# 7. Anti-CSRF Violation Decision: Modifying Request + Untrusted Origin
map "$is_modifying_request:$untrusted_csrf_origin" $csrf_block_status {
    "1:1" 1;
    default 0;
}

# 8. Anti-CORS Origin Gate: Reject preflights from untrusted origins immediately
map $request_method $is_preflight_request {
    default 0;
    OPTIONS 1;
}

map "$is_preflight_request:$untrusted_csrf_origin" $cors_preflight_block_status {
    "1:1" 1;
    default 0;
}

# 8. WebSocket Connection Upgrade Map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name volpehub.in www.volpehub.in volpehub.education www.volpehub.education localhost 127.0.0.1 _;
    # Keep redirects relative so a non-default local port (such as 3001) is kept.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Performance Tuning & Buffers
    client_max_body_size 100M;
    client_body_buffer_size 256k;

    # Connection Flooding Protection
    limit_conn addr_conn_zone 10000;
    limit_conn_status 429;
    limit_req_status 429;

    # Rate Limiting Custom Error Handling (Clean JSON + Retry-After Header)
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error": "Too Many Requests", "detail": "Rate limit exceeded. Please try again later.", "retryAfter": 60}\n';
    }

    # Universal Anti-XSS and Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://challenges.cloudflare.com; frame-src 'self' blob: https://challenges.cloudflare.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=()" always;

    # High-Performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ──────────────────────────────────────────────────────────────────────────
    # 0. Security Gateway: Block all access to hidden files and server secrets
    # ──────────────────────────────────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* (/\.env|/\.git|/\.yml|/\.yaml|/\.sh|/\.conf)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ^~ /secrets/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Never serve JavaScript/CSS source maps, even if one is accidentally
    # copied into the production assets directory.
    location ~* \.map$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 1. Frontend Single Page Application (SPA Fallback Routing)
    # ──────────────────────────────────────────────────────────────────────────
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://challenges.cloudflare.com; frame-src 'self' blob: https://challenges.cloudflare.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=()" always;
        try_files $uri $uri/ /index.html;
    }

    # Keep /admin on the React school-administrator portal. Django's own
    # maintenance interface is served separately at /django-admin/.
    location = /admin {
        try_files /index.html =404;
    }

    location = /admin/ {
        try_files /index.html =404;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 2. Immutable Cache for Compiled Assets (CSS, JS, Fonts)
    # ──────────────────────────────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 3. Health Probe
    # ──────────────────────────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 4a. Login controls are per submitted account in Django. Keep this path
    # free of a shared-IP request quota so one NAT's students do not consume
    # one another's login allowance.
    # ──────────────────────────────────────────────────────────────────────────
    location = /api/v1/auth/login/ {
        # Anti-CSRF Origin Gate
        if ($csrf_block_status = 1) {
            return 403 '{"detail": "Cross-Site Request Forgery (CSRF) blocked by security proxy."}\n';
        }

        proxy_pass http://api-backend-cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 4. Authentication API (OTP and refresh quotas are per challenge/session)
    # ──────────────────────────────────────────────────────────────────────────
    location /api/v1/auth/ {
        # Anti-CSRF Origin Gate
        if ($csrf_block_status = 1) {
            return 403 '{"detail": "Cross-Site Request Forgery (CSRF) blocked by security proxy."}\n';
        }

        proxy_pass http://api-backend-cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 5. General REST APIs (least-connection API replica balancing)
    # ──────────────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=general_api_zone burst=100;

        # Anti-CSRF Origin Gate
        if ($csrf_block_status = 1) {
            return 403 '{"detail": "Cross-Site Request Forgery (CSRF) blocked by security proxy."}\n';
        }

        rewrite ^/api/v1/api/v1/(.*)$ /api/v1/$1 break;

        proxy_pass http://api-backend-cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 6. Private Django maintenance portal
    # ──────────────────────────────────────────────────────────────────────────
    location = /django-admin {
        return 308 /django-admin/;
    }

    location /django-admin/ {
        proxy_pass http://api-backend-cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 7. Static & Media Storage
    # ──────────────────────────────────────────────────────────────────────────
    location /static/ {
        proxy_pass http://api-backend-cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location /media/ {
        proxy_pass http://api-backend-cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # 8. Real-Time WebSockets (Direct Chat, Typing, Presence)
    # ──────────────────────────────────────────────────────────────────────────
    location /ws/ {
        limit_req zone=ws_handshake_zone burst=10;

        # Anti-CSWSH: Reject cross-site WebSocket handshakes from untrusted origins
        if ($untrusted_csrf_origin = 1) {
            return 403 '{"detail": "WebSocket handshake rejected: origin is not authorized."}\n';
        }
        proxy_pass http://websocket-cluster;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }
}
