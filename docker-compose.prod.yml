name: volpehub

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-volpehub_education}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-volpehub_education}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=12GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-volpehub_education}"]
      interval: 10s
      timeout: 5s
      retries: 10
    dns:
      - 8.8.8.8
      - 1.1.1.1

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${APP_DB_USER:-volpehub_education}
      DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:-volpehub_education}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-5000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-50}
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 5
      # PostgreSQL is configured for 100 total connections; reserve headroom
      # for migrations, monitoring, and administrative sessions.
      MAX_DB_CONNECTIONS: 80
      SERVER_IDLE_TIMEOUT: 600
      SERVER_LIFETIME: 3600
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    expose:
      - "5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${APP_DB_USER:-volpehub_education} -d ${POSTGRES_DB:-volpehub_education}"]
      interval: 10s
      timeout: 3s
      retries: 5
    dns:
      - 8.8.8.8
      - 1.1.1.1

  backup_scheduler:
    image: postgres:16-alpine
    user: "0:0"
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-volpehub_education}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup-scheduler.sh:/usr/local/bin/backup-scheduler.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-scheduler.sh"]
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    # Broker/channel keys must not be evicted: reject writes at capacity instead.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    dns:
      - 8.8.8.8
      - 1.1.1.1

  redis_cache:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --save \"\" --appendonly no --maxmemory 1gb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    dns:
      - 8.8.8.8
      - 1.1.1.1

  api:
    scale: ${API_REPLICAS:-2}
    image: ${VOLPEHUB_API_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-worexatechnologies-stack}/volpehub-api:${IMAGE_TAG:-latest}}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      REDIS_CACHE_URL: "${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD}@redis_cache:6379/0}"
      HTTP_PROXY: http://forwardproxy:8888
      HTTPS_PROXY: http://forwardproxy:8888
      NO_PROXY: localhost,127.0.0.1,api,web,db,pgbouncer,redis,redis_cache,forwardproxy
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      # The CD workflow runs migrations and collectstatic once before bringing
      # up replicas; avoid concurrent startup work against shared DB/storage.
      SKIP_STARTUP_MIGRATIONS: "1"
      SKIP_STARTUP_COLLECTSTATIC: "1"
    volumes:
      - static_data:/app/staticfiles
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    dns:
      - 8.8.8.8
      - 1.1.1.1

  forwardproxy:
    image: ${VOLPEHUB_FORWARDPROXY_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-worexatechnologies-stack}/volpehub-forwardproxy:${IMAGE_TAG:-latest}}
    build:
      context: ./forward_proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "curl", "-I", "-x", "http://127.0.0.1:8888", "http://httpbin.org/get"]
      interval: 30s
      timeout: 5s
      retries: 3
    dns:
      - 8.8.8.8
      - 1.1.1.1

  web:
    image: ${VOLPEHUB_WEB_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-worexatechnologies-stack}/volpehub-web:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
        VITE_CLOUDFLARE_TURNSTILE_SITE_KEY: ${VITE_CLOUDFLARE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      retries: 5
    dns:
      - 8.8.8.8
      - 1.1.1.1

  celery_worker:
    image: ${VOLPEHUB_API_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-worexatechnologies-stack}/volpehub-api:${IMAGE_TAG:-latest}}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      REDIS_CACHE_URL: "${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD}@redis_cache:6379/0}"
      HTTP_PROXY: http://forwardproxy:8888
      HTTPS_PROXY: http://forwardproxy:8888
      NO_PROXY: localhost,127.0.0.1,api,web,db,pgbouncer,redis,redis_cache,forwardproxy
      CELERY_WORKER: "1"
    command: celery -A config worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-4} --queues=default,high_priority,reports
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    ports:
      - "${CADDY_HTTP_PORT:-8081}:80"
      - "${CADDY_HTTPS_PORT:-8444}:443"
      - "${CADDY_HTTPS_PORT:-8444}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/srv/static:ro
    depends_on:
      - web
      - api
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  postgres_data:
    name: volpehub_postgres_data
  redis_data:
    name: volpehub_redis_data
  static_data:
    name: volpehub_static_data
  caddy_data:
    name: volpehub_caddy_data
  caddy_config:
    name: volpehub_caddy_config

networks:
  default:
    name: volpehub_default
