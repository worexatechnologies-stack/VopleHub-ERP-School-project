## Volpehub Education Outbound Forward Proxy Configuration
## High-performance, low-memory Egress Forward Proxy for outbound API calls, payment gateways, FCM, and SMS.

User nobody
Group nobody

Port 8888
Listen 0.0.0.0
BindSame yes

Timeout 300
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/var/run/tinyproxy/tinyproxy.pid"

# Maximum simultaneous client connections
MaxClients 1000
MinSpareServers 10
MaxSpareServers 50
StartServers 20
MaxRequestsPerChild 0

# Security: Allow all internal Docker subnets to route outbound traffic
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# HTTPS Tunneling Ports (Allow outbound HTTPS 443, 80, and SMTPS)
ConnectPort 443
ConnectPort 80
ConnectPort 587
ConnectPort 465

ViaProxyName "volpehub-egress-forward-proxy"
DisableViaHeader No
