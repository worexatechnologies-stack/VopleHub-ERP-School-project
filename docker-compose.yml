services:
  db:
    image: postgres:16-alpine
    command: postgres -c max_connections=200 -c shared_buffers=1GB -c effective_cache_size=4GB -c work_mem=32MB -c maintenance_work_mem=256MB -c random_page_cost=1.1 -c effective_io_concurrency=200 -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c autovacuum_vacuum_scale_factor=0.05 -c autovacuum_vacuum_cost_limit=2000 -c max_locks_per_transaction=256
    environment:
      POSTGRES_DB: volpehub_education
      POSTGRES_USER: volpehub_education
      POSTGRES_PASSWORD: worexa@123
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: volpehub_education
      DB_PASSWORD: worexa@123
      DB_NAME: volpehub_education
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 15
      RESERVE_POOL_TIMEOUT: 5
      MAX_DB_CONNECTIONS: 150
      QUERY_TIMEOUT: 120
      SERVER_IDLE_TIMEOUT: 300
      SERVER_LIFETIME: 3600
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - "6432:5432"
    depends_on:
      - db
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 1gb --maxmemory-policy noeviction --tcp-backlog 2048
    ports: ["6379:6379"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis_cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --tcp-backlog 2048
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  api:
    build: ./backend
    command: sh -c "gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 3 --backlog 2048 --timeout 120 --reload"
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://volpehub_education:worexa%40123@pgbouncer:5432/volpehub_education
      DIRECT_DATABASE_URL: postgres://volpehub_education:worexa%40123@db:5432/volpehub_education
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis_cache:6379/0
      DJANGO_CACHE_BACKEND: django.core.cache.backends.redis.RedisCache
      HTTP_PROXY: http://forwardproxy:8888
      HTTPS_PROXY: http://forwardproxy:8888
      NO_PROXY: localhost,127.0.0.1,api,web,db,pgbouncer,redis,redis_cache,forwardproxy
    volumes: [./backend:/app]
    ports: ["8000:8000"]
    depends_on: [pgbouncer, redis, redis_cache, forwardproxy]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  celery_worker:
    build: ./backend
    command: celery -A config worker --loglevel=INFO --concurrency=2 --queues=default,high_priority,reports
    environment:
      DATABASE_URL: postgres://volpehub_education:worexa%40123@pgbouncer:5432/volpehub_education
      DIRECT_DATABASE_URL: postgres://volpehub_education:worexa%40123@db:5432/volpehub_education
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis_cache:6379/0
      CELERY_WORKER: "1"
    volumes: [./backend:/app]
    depends_on: [pgbouncer, redis, redis_cache]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  forwardproxy:
    build:
      context: ./forward_proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8888:8888"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    ports:
      - "3001:80"
    depends_on:
      - api
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
